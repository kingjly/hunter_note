<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BugBounty Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="header">
        <h1 class="title">BugBounty Tracker</h1>
        <button id="themeToggle" class="icon-btn" aria-label="切换主题" title="切换深色/浅色模式">
          <svg id="iconSun" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg id="iconMoon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </header>
      <nav class="tabs" role="tablist" aria-label="主功能切换">
        <button class="tab active" data-tab="history" role="tab" aria-selected="true">历史记录</button>
        <button class="tab" data-tab="notes" role="tab" aria-selected="false">笔记管理</button>
        <button class="tab" data-tab="settings" role="tab" aria-selected="false">设置</button>
      </nav>
      <section id="history" class="tab-panel active" role="tabpanel" aria-labelledby="历史记录">
        <div class="toolbar">
          <input id="search" type="search" placeholder="搜索域名" aria-label="搜索域名" />
          <button id="markCurrent" class="btn">标记当前域</button>
          <button id="unmarkCurrent" class="btn">取消标记</button>
          <button id="deleteSelected" class="btn danger">删除选中</button>
          <button id="clearHistory" class="btn danger">清空历史</button>
          <span id="currentDomain" class="muted"></span>
        </div>
        <div id="tree" class="tree"></div>
      </section>
      <section id="notes" class="tab-panel" role="tabpanel" aria-labelledby="笔记管理">
        <div class="toolbar">
          <input id="notesSearch" type="search" placeholder="搜索笔记内容或域名" aria-label="搜索笔记内容或域名" />
          <button id="clearNotes" class="btn danger">清空笔记</button>
        </div>
        <div id="notesList" class="notes"></div>
      </section>
      <section id="settings" class="tab-panel" role="tabpanel">
        <div class="settings">
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-title">悬浮图标</div>
              <div class="setting-desc muted">在页面右下角显示悬浮图标</div>
            </div>
            <label class="switch">
              <input id="floatToggle" type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>
          <p class="muted">存储使用量与清理</p>
          <button id="clearAll" class="btn danger">清空所有数据</button>
          <p id="storageUsage" class="muted"></p>
        </div>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
